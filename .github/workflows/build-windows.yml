name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  quality:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
  build:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: python -m pip install -r requirements-dev.txt
      - name: Portable folder
        run: python -m PyInstaller --noconfirm --clean InstagramResearchSuite.spec
      - name: Single file
        run: python -m PyInstaller --noconfirm --clean --distpath dist-onefile InstagramResearchSuite.spec
        env: { IRS_ONEFILE: "1" }
      - name: Zip portable folder
        run: Compress-Archive -Path dist\InstagramResearchSuite -DestinationPath InstagramResearchSuite-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InstagramResearchSuite-windows
          path: |
            InstagramResearchSuite-portable.zip
            dist-onefile/InstagramResearchSuite.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            InstagramResearchSuite-portable.zip
            dist-onefile/InstagramResearchSuite.exe
