name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - run: python -m pip install -r requirements-dev.txt
      - name: Sanity check - source packages are tracked
        run: test -f app/data/database.py && test -f app/providers/base.py
      - run: python -m ruff check .
      - run: python -m pytest
