[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-research-suite"
version = "1.0.3"
description = "Windows portable desktop suite for viewing, analysing and monitoring Instagram data you are authorised to access"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6,<7", "openpyxl>=3.1", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5,<1", "pyinstaller>=6.6,<7", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
# Safety net: an older prototype may still exist in src/ of your GitHub repo. It is not part of this app.
extend-exclude = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S110", "B008", "E741", "UP037", "UP006", "UP007", "UP035", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["PySide6"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]
"scripts/*" = ["S", "E402", "E702"]
