[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-research-suite"
version = "0.1.0"
description = "A privacy-conscious desktop workspace for permitted Instagram research and local analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Instagram Research Suite Contributors" }]
dependencies = ["PySide6>=6.7,<7", "platformdirs>=4.2,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.5", "pyinstaller>=6.8"]

[project.scripts]
instagram-research-suite = "instagram_research_suite.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]